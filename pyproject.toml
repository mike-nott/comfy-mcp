[project]
name = "comfy-mcp"
version = "0.1.2"
description = "MCP server for private one-shot media generation on your own ComfyUI"
readme = "README.md"
license = "MIT"
authors = [{ name = "Mike Nott", email = "mike@nott.org" }]
requires-python = ">=3.12"
keywords = ["mcp", "comfyui", "image-generation", "qwen-image", "self-hosted"]
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.2",
    "pillow>=12.3.0",
    "uvicorn>=0.53.0",
    "websockets>=17.1",
]

[project.scripts]
comfy-mcp = "comfy_mcp.cli:main"

[project.urls]
Repository = "https://github.com/mike-nott/comfy-mcp"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 140
